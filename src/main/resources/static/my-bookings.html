<!DOCTYPE html>
<!--suppress ALL -->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Bookings – RouteX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/home.css"/>
<style>

  .page-hero {
    background: linear-gradient(135deg, rgba(79,142,247,0.2), rgba(124,58,237,0.15));
    border-bottom: 2px solid rgba(79, 142, 247, 0.2);
    padding: 4rem 5%;
    text-align: center;
    position: relative;
    z-index: 1;
    box-shadow: 0 10px 30px rgba(79, 142, 247, 0.1);
  }
  .page-hero h1 { 
    font-size: 2.8rem; 
    font-weight: 800; 
    color: #fff;
    background: linear-gradient(135deg, #4f8ef7, #00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.8rem;
  }
  .page-hero p { 
    color: rgba(255, 255, 255, 0.7); 
    margin-top: 0.8rem;
    font-size: 1.05rem;
    font-weight: 500;
  }

  .bookings-container {
    max-width: 900px;
    margin: 2.5rem auto;
    padding: 0 5%;
    position: relative;
    z-index: 1;
  }

  /* Filter bar */
  .filter-bar {
    display: flex;
    gap: 1.2rem;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 2rem;
    background: linear-gradient(135deg, rgba(13, 27, 75, 0.8), rgba(15, 35, 90, 0.75));
    border: 1.5px solid rgba(79, 142, 247, 0.3);
    border-radius: 16px;
    padding: 1.2rem 1.8rem;
    backdrop-filter: blur(25px);
    box-shadow: 0 8px 25px rgba(79, 142, 247, 0.1);
  }
  .filter-bar::before {
    content: '';
    position: absolute;
    top: -1.5px;
    left: 20px;
    right: 20px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(79, 142, 247, 0.3), transparent);
  }
  .result-count { margin-left: auto; font-size: 0.8rem; color: var(--text-muted); }

  /* Premium Navbar Styling */
  .navbar {
    background: linear-gradient(135deg, rgba(13, 27, 75, 0.95), rgba(15, 35, 90, 0.92)) !important;
    border: 2px solid rgba(79, 142, 247, 0.3) !important;
    backdrop-filter: blur(25px) !important;
    box-shadow: 0 8px 32px rgba(79, 142, 247, 0.15), 0 0 1px rgba(79, 142, 247, 0.5) !important;
    border-radius: 16px !important;
    padding: 0.7rem 1.8rem !important;
    position: relative;
    overflow: hidden;
  }
  
  .navbar::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(79, 142, 247, 0.5), transparent);
  }

  .nav-logo {
    font-size: 1.2rem !important;
    font-weight: 800 !important;
    background: linear-gradient(135deg, #4f8ef7, #7c3aed) !important;
    -webkit-background-clip: text !important;
    -webkit-text-fill-color: transparent !important;
    background-clip: text !important;
    text-decoration: none !important;
    letter-spacing: 0.5px !important;
    display: flex !important;
    align-items: center !important;
    gap: 0.5rem !important;
    transition: all 0.3s ease !important;
    cursor: pointer !important;
  }

  .nav-logo:hover {
    transform: scale(1.05) !important;
    filter: drop-shadow(0 0 8px rgba(79, 142, 247, 0.4)) !important;
  }

  .nav-links {
    display: flex !important;
    gap: 2rem !important;
    align-items: center !important;
  }

  .nav-links a {
    color: rgba(255, 255, 255, 0.75) !important;
    text-decoration: none !important;
    font-size: 0.85rem !important;
    font-weight: 500 !important;
    position: relative !important;
    transition: all 0.3s ease !important;
    padding: 0.4rem 0 !important;
  }

  .nav-links a::before {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, #4f8ef7, #7c3aed);
    transition: width 0.3s ease !important;
  }

  .nav-links a:hover {
    color: #fff !important;
  }

  .nav-links a:hover::before {
    width: 100% !important;
  }

  .nav-links a[href="index.html"] {
    color: rgba(255, 255, 255, 0.8) !important;
  }

  .nav-links a[href="index.html"]::before {
    background: linear-gradient(90deg, #4f8ef7, #00aaff) !important;
  }

  .nav-links a[href="index.html"]:hover {
    color: #fff !important;
    text-shadow: 0 0 12px rgba(79, 142, 247, 0.5) !important;
  }

  .btn-nav {
    background: linear-gradient(135deg, rgba(79, 142, 247, 0.2), rgba(124, 58, 237, 0.15)) !important;
    border: 1.5px solid rgba(79, 142, 247, 0.4) !important;
    color: #fff !important;
    padding: 0.5rem 1.2rem !important;
    border-radius: 10px !important;
    font-weight: 600 !important;
    font-size: 0.8rem !important;
    cursor: pointer !important;
    transition: all 0.3s ease !important;
  }

  .btn-nav:hover {
    background: linear-gradient(135deg, rgba(79, 142, 247, 0.35), rgba(124, 58, 237, 0.25)) !important;
    border-color: rgba(79, 142, 247, 0.7) !important;
    box-shadow: 0 4px 15px rgba(79, 142, 247, 0.3) !important;
    transform: translateY(-2px) !important;
  }

  /* Ensure dropdowns work on different screen sizes */
  @media (max-width: 768px) {
    .filter-bar {
      flex-direction: column;
      align-items: flex-start;
    }
    .result-count {
      margin-left: 0;
      width: 100%;
      text-align: right;
    }
  }

  /* Filter bar premium styles */
  .filter-bar label { 
    font-size: 0.9rem; 
    color: rgba(255, 255, 255, 0.75);
    font-weight: 600;
  }

  .filter-select {
    background: linear-gradient(135deg, rgba(79,142,247,0.15), rgba(124,58,237,0.08));
    border: 1.5px solid rgba(79,142,247,0.4);
    border-radius: 10px;
    color: var(--text);
    padding: 0.65rem 1.2rem;
    padding-right: 2.5rem;
    font-family: 'Poppins', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    outline: none;
    cursor: pointer;
    transition: all 0.3s ease;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='rgba(255,255,255,0.6)' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 0.7rem center;
    background-size: 1.5em 1.5em;
  }

  .filter-select:hover {
    border-color: rgba(79,142,247,0.7);
    background-color: rgba(79,142,247,0.2);
    box-shadow: 0 4px 15px rgba(79,142,247,0.2);
  }

  .filter-select:focus {
    border-color: rgba(79,142,247,0.9);
    background-color: rgba(79,142,247,0.25);
    box-shadow: 0 0 0 3px rgba(79,142,247,0.15), 0 4px 15px rgba(79,142,247,0.3);
  }

  .filter-select option {
    background: #0d1b4b;
    color: var(--text);
    padding: 0.5rem;
  }

  .filter-select option:checked {
    background: linear-gradient(135deg, rgba(79,142,247,0.5), rgba(124,58,237,0.3));
    color: #fff;
  }

  /* Booking card */
  .booking-card {
    background: var(--card-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 1.8rem;
    margin-bottom: 1.2rem;
    backdrop-filter: blur(20px);
    transition: border-color 0.3s, transform 0.2s;
    animation: fadeUp 0.4s ease both;
    position: relative;
    overflow: hidden;
  }
  .booking-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    border-radius: 4px 0 0 4px;
  }
  .booking-card.confirmed::before { background: var(--success); }
  .booking-card.pending::before   { background: var(--warning); }
  .booking-card.cancelled::before { background: var(--danger); }
  .booking-card:hover { border-color: rgba(79,142,247,0.3); transform: translateY(-2px); }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1.2rem;
    flex-wrap: wrap;
    gap: 0.8rem;
  }
  .booking-ref {
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .booking-ref span {
    color: var(--accent);
    font-family: monospace;
    font-weight: 700;
    font-size: 0.9rem;
  }
  .status-badge {
    padding: 0.3rem 0.9rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .status-badge.confirmed  { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid rgba(16,185,129,0.3); }
  .status-badge.pending    { background: rgba(245,158,11,0.15); color: var(--warning); border: 1px solid rgba(245,158,11,0.3); }
  .status-badge.cancelled  { background: rgba(239,68,68,0.15);  color: var(--danger);  border: 1px solid rgba(239,68,68,0.3);  }

  .route-display {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.2rem;
  }
  .route-city { font-size: 1.3rem; font-weight: 800; color: #fff; }
  .route-arrow { color: var(--accent); font-size: 1.3rem; }

  .card-meta {
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    margin-bottom: 1.2rem;
  }
  .meta-item { display: flex; flex-direction: column; gap: 0.2rem; }
  .meta-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .meta-value { font-size: 0.9rem; font-weight: 600; color: var(--text); }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 1rem;
    border-top: 1px solid var(--glass-border);
    flex-wrap: wrap;
    gap: 0.8rem;
  }
  .total-amount {
    font-size: 1.3rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .card-actions { display: flex; gap: 0.7rem; }

  .btn-action {
    padding: 0.5rem 1.2rem;
    border-radius: 8px;
    font-family: 'Poppins', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }
  .btn-view-qr {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
  }
  .btn-cancel {
    background: transparent;
    border: 1px solid rgba(239,68,68,0.4);
    color: var(--danger);
  }
  .btn-cancel:hover { background: rgba(239,68,68,0.1); }
  .btn-action:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn-action:disabled { opacity: 0.4; cursor: not-allowed; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Pagination */
  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.5rem;
    margin-top: 2rem;
  }
  .page-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 1px solid var(--glass-border);
    background: var(--glass);
    color: var(--text-muted);
    font-family: 'Poppins', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .page-btn:hover, .page-btn.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent;
    color: #fff;
  }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-muted);
  }
  .empty-state .empty-icon { font-size: 3.5rem; margin-bottom: 1rem; opacity: 0.5; }
  .empty-state h3 { font-size: 1.2rem; color: var(--text); margin-bottom: 0.5rem; }
  .empty-state a {
    display: inline-block;
    margin-top: 1.2rem;
    padding: 0.7rem 1.8rem;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    transition: opacity 0.2s;
  }
  .empty-state a:hover { opacity: 0.85; }

  /* Skeleton */
  .skeleton-card {
    background: var(--card-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 1.8rem;
    margin-bottom: 1.2rem;
  }
  .skeleton {
    background: linear-gradient(90deg, var(--glass) 25%, rgba(255,255,255,0.08) 50%, var(--glass) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 6px;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .sk-h1 { height: 20px; width: 40%; margin-bottom: 1rem; }
  .sk-h2 { height: 30px; width: 60%; margin-bottom: 1rem; }
  .sk-h3 { height: 16px; width: 80%; }

  /* QR Modal */
  .qr-modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .qr-modal-overlay.show { display: flex; }
  .qr-modal {
    background: #0d1b4b;
    border: 1px solid rgba(79,142,247,0.3);
    border-radius: 24px;
    padding: 2.5rem;
    max-width: 380px;
    width: 100%;
    text-align: center;
    animation: scaleIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.85); }
    to   { opacity: 1; transform: scale(1); }
  }
  .qr-modal h3 { font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 0.4rem; }
  .qr-modal p  { color: var(--text-muted); font-size: 0.82rem; margin-bottom: 1.5rem; }
  .qr-box {
    background: #fff;
    border-radius: 12px;
    padding: 1rem;
    display: inline-block;
    margin-bottom: 1.5rem;
  }
  .qr-box img { width: 200px; height: 200px; display: block; }
  .btn-close-modal {
    background: transparent;
    border: 1px solid var(--glass-border);
    color: var(--text-muted);
    padding: 0.7rem 2rem;
    border-radius: 10px;
    font-family: 'Poppins', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-close-modal:hover { border-color: var(--accent); color: var(--accent); }

  /* Confirm Cancel Modal */
  .cancel-modal {
    background: #0d1b4b;
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 20px;
    padding: 2rem;
    max-width: 360px;
    width: 100%;
    text-align: center;
  }
  .cancel-modal .warn-icon { font-size: 2.5rem; margin-bottom: 1rem; }
  .cancel-modal h3 { color: #fff; font-size: 1.1rem; margin-bottom: 0.5rem; }
  .cancel-modal p  { color: var(--text-muted); font-size: 0.83rem; margin-bottom: 1.5rem; }
  .cancel-modal-btns { display: flex; gap: 1rem; }
  .btn-confirm-cancel {
    flex: 1;
    padding: 0.75rem;
    background: var(--danger);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-confirm-cancel:hover { opacity: 0.85; }
  .btn-keep {
    flex: 1;
    padding: 0.75rem;
    background: transparent;
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    color: var(--text-muted);
    font-family: 'Poppins', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-keep:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <a href="index.html" class="nav-logo">🚌 RouteX</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="results.html">Search</a>
    <a href="my-bookings.html" style="color:var(--accent)">My Bookings</a>
    <a href="#" id="logoutBtn" class="btn-nav">Logout</a>
  </div>
</nav>

<!-- Hero -->
<div class="page-hero">
  <h1>🎫 My Bookings</h1>
  <p>View and manage all your bus bookings</p>
</div>

<div class="bookings-container">

  <!-- Filter Bar -->
  <div class="filter-bar">
    <label>Filter by Status:</label>
    <select class="filter-select" id="statusFilter" onchange="applyFilter()">
      <option value="">All Bookings</option>
      <option value="CONFIRMED">Confirmed</option>
      <option value="PENDING">Pending</option>
      <option value="CANCELLED">Cancelled</option>
    </select>
    <label>Sort by:</label>
    <select class="filter-select" id="sortFilter" onchange="applyFilter()">
      <option value="createdAt,desc">Newest First</option>
      <option value="createdAt,asc">Oldest First</option>
      <option value="totalAmount,desc">Highest Amount</option>
    </select>
    <span class="result-count" id="resultCount"></span>
  </div>

  <!-- Bookings List -->
  <div id="bookingsList"></div>

  <!-- Pagination -->
  <div class="pagination" id="pagination"></div>
</div>

<!-- QR Modal -->
<div class="qr-modal-overlay" id="qrModal">
  <div class="qr-modal">
    <h3>🎫 Your Boarding Pass</h3>
    <p id="qrRef"></p>
    <div class="qr-box">
      <img id="qrImage" src="" alt="QR Code"/>
    </div>
    <p style="font-size:0.75rem;color:var(--text-muted);margin-bottom:1rem;">
      Show this QR at the bus bay for boarding
    </p>
    <button class="btn-close-modal" onclick="closeQrModal()">Close</button>
  </div>
</div>

<!-- Cancel Confirm Modal -->
<div class="qr-modal-overlay" id="cancelModal">
  <div class="cancel-modal">
    <div class="warn-icon">⚠️</div>
    <h3>Cancel Booking?</h3>
    <p>Are you sure you want to cancel booking <strong id="cancelRef"></strong>? This action cannot be undone.</p>
    <div class="cancel-modal-btns">
      <button class="btn-keep" onclick="closeCancelModal()">Keep It</button>
      <button class="btn-confirm-cancel" id="confirmCancelBtn" onclick="executeCancel()">Yes, Cancel</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<footer>
  <p>© 2026 RouteX · All rights reserved</p>
</footer>

<script>
  const API = '';
  let currentPage = 0;
  let totalPages = 0;
  let currentFilter = '';
  let currentSort = "createdAt,desc";
  let cancelTarget = null;

  // ── Auth Guard ──
  const token = localStorage.getItem('routex_token');
  if (!token) { window.location.href = 'login.html'; }

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.clear();
    document.cookie = 'routex_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
    window.location.href = 'index.html';
  });

  function authHeaders() {
    return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
  }

  // ── Load Bookings ──
  async function loadBookings(page = 0) {
    const list = document.getElementById('bookingsList');
    list.innerHTML = [1,2,3].map(() => `
      <div class="skeleton-card">
        <div class="skeleton sk-h1"></div>
        <div class="skeleton sk-h2"></div>
        <div class="skeleton sk-h3"></div>
      </div>`).join('');

    try {
      const sort = document.getElementById('sortFilter').value;
      const status = document.getElementById('statusFilter').value;
      const params = new URLSearchParams({ page, size: 6, sort });
      if (status) params.set('status', status);

      const res = await fetch(`${API}/api/bookings/my?${params}`, { headers: authHeaders() });
      if (res.status === 401) { window.location.href = 'login.html'; return; }
      const data = await res.json();

      if (data.success) {
        const pg = data.data;
        totalPages = pg.totalPages;
        currentPage = pg.number;
        renderBookings(pg.content, pg.totalElements);
        renderPagination(pg.totalPages, pg.number);
      }
    } catch (e) {
      list.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:2rem;">Failed to load bookings.</p>';
    }
  }

  function renderBookings(bookings, total) {
    const list = document.getElementById('bookingsList');
    document.getElementById('resultCount').textContent = `${total} booking${total !== 1 ? 's' : ''} found`;

    if (!bookings || bookings.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🎫</div>
          <h3>No Bookings Yet</h3>
          <p>You haven't made any bookings. Start your journey today!</p>
          <a href="index.html">Search for Buses</a>
        </div>`;
      return;
    }

    list.innerHTML = bookings.map((b, i) => `
      <div class="booking-card ${b.status.toLowerCase()}" style="animation-delay:${i*0.08}s">
        <div class="card-header">
          <div class="booking-ref">
            Booking Reference: <span>${b.bookingReference}</span>
          </div>
          <span class="status-badge ${b.status.toLowerCase()}">${b.status}</span>
        </div>
        <div class="route-display">
          <span class="route-city">${b.origin}</span>
          <span class="route-arrow">→</span>
          <span class="route-city">${b.destination}</span>
        </div>
        <div class="card-meta">
          <div class="meta-item">
            <span class="meta-label">🗓 Travel Date</span>
            <span class="meta-value">${formatDate(b.travelDate)}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">🕐 Departure</span>
            <span class="meta-value">${b.departureTime}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">💺 Seats</span>
            <span class="meta-value">${b.seats ? b.seats.join(", ") : "—"}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">🚌 Bus Type</span>
            <span class="meta-value">${b.busType || "Normal"}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">📞 Contact</span>
            <span class="meta-value">${b.contactNumber || '—'}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">📅 Booked On</span>
            <span class="meta-value">${b.createdAt || "—"}</span>
          </div>
        </div>
        <div class="card-footer">
          <span class="total-amount">Rs. ${b.totalAmount.toLocaleString()}</span>
          <div class="card-actions">
            ${b.qrCode ? `<button class="btn-action btn-view-qr" onclick="showQR('${b.bookingReference}','${b.qrCode}')">📱 View QR</button>` : ''}
            ${b.status !== 'CANCELLED' ? `<button class="btn-action btn-cancel" onclick="confirmCancel('${b.bookingReference}')">Cancel</button>` : ''}
          </div>
        </div>
      </div>`).join('');
  }

  function renderPagination(total, current) {
    const pg = document.getElementById('pagination');
    if (total <= 1) { pg.innerHTML = ''; return; }
    let html = `<button class="page-btn" onclick="loadBookings(${current-1})" ${current===0?'disabled':''}>‹</button>`;
    for (let i = 0; i < total; i++) {
      if (total > 7 && Math.abs(i - current) > 2 && i !== 0 && i !== total-1) {
        if (i === 1 || i === total-2) html += `<span style="color:var(--text-muted)">…</span>`;
        continue;
      }
      html += `<button class="page-btn ${i===current?'active':''}" onclick="loadBookings(${i})">${i+1}</button>`;
    }
    html += `<button class="page-btn" onclick="loadBookings(${current+1})" ${current===total-1?'disabled':''}>›</button>`;
    pg.innerHTML = html;
  }

  function applyFilter() { loadBookings(0); }

  // ── QR Modal ──
  function showQR(ref, qrBase64) {
    document.getElementById('qrRef').textContent = `Reference: ${ref}`;
    document.getElementById('qrImage').src = `data:image/png;base64,${qrBase64}`;
    document.getElementById('qrModal').classList.add('show');
  }
  function closeQrModal() { document.getElementById('qrModal').classList.remove('show'); }

  // ── Cancel ──
  function confirmCancel(ref) {
    cancelTarget = ref;
    document.getElementById('cancelRef').textContent = ref;
    document.getElementById('cancelModal').classList.add('show');
  }
  function closeCancelModal() { document.getElementById('cancelModal').classList.remove('show'); cancelTarget = null; }

  async function executeCancel() {
    if (!cancelTarget) return;
    const btn = document.getElementById('confirmCancelBtn');
    btn.textContent = 'Cancelling…'; btn.disabled = true;
    try {
      const res = await fetch(`${API}/api/bookings/${cancelTarget}/cancel`, {
        method: 'PUT', headers: authHeaders()
      });
      const data = await res.json();
      if (data.success) {
        showToast('Booking cancelled successfully', 'success');
        closeCancelModal();
        loadBookings(currentPage);
      } else {
        showToast(data.message || 'Cancellation failed', 'error');
      }
    } catch (e) {
      showToast('Network error. Try again.', 'error');
    } finally {
      btn.textContent = 'Yes, Cancel'; btn.disabled = false;
    }
  }

  // ── Utilities ──
  function formatDate(ds) {
    if (!ds) return '—';
    return new Date(ds).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  }

  function showToast(msg, type = 'success') {
    const icons = { success:'✅', error:'❌', warning:'⚠️' };
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerHTML = `<span class="toast-icon">${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
    document.getElementById('toastContainer').appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }

  // ── Init ──
  loadBookings();
</script>
</body>
</html>
